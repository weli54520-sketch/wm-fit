# يبني ملف APK حق "WM Onyx" (اللانشر المعتمد) وينزله بصفحة Releases
name: Build WM Onyx

on:
  push:
    paths:
      - "onyx/**"
      - ".github/workflows/onyx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onyx
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test grid engine
        run: chmod +x gradlew && ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Read version
        id: version
        run: echo "name=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "../WM-Onyx-${{ steps.version.outputs.name }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: onyx-v${{ steps.version.outputs.name }}
          name: WM Onyx ${{ steps.version.outputs.name }}
          body_path: onyx/RELEASE_NOTES.md
          files: WM-Onyx-*.apk
          target_commitish: ${{ github.sha }}
          make_latest: true
