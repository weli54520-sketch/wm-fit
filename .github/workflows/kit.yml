# يبني تطبيق "WM Onyx" الجديد (مو لانشر) وينزله بصفحة Releases
name: Build WM Onyx (kit)

on:
  push:
    paths:
      - "kit/**"
      - ".github/workflows/kit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Read version
        id: version
        run: echo "name=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/kit-v${{ steps.version.outputs.name }}" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        if: steps.exists.outputs.skip != 'true'
        run: cp app/build/outputs/apk/release/app-release.apk "../WM-Onyx-New-${{ steps.version.outputs.name }}.apk"

      - name: Publish release
        if: steps.exists.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kit-v${{ steps.version.outputs.name }}
          name: WM Onyx الجديد ${{ steps.version.outputs.name }}
          body_path: kit/RELEASE_NOTES.md
          files: WM-Onyx-New-*.apk
          target_commitish: ${{ github.sha }}
          make_latest: true
