# يبني ملف APK حق "تجربة اللانشر" وينزله بصفحة Releases
name: Build Trial Launcher

on:
  push:
    paths:
      - "trial/**"
      - ".github/workflows/trial.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trial
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Read version
        id: version
        run: echo "name=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "../Trial-Launcher-${{ steps.version.outputs.name }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trial-v${{ steps.version.outputs.name }}
          name: تجربة اللانشر ${{ steps.version.outputs.name }}
          body_path: trial/RELEASE_NOTES.md
          files: Trial-Launcher-*.apk
          target_commitish: ${{ github.sha }}
          make_latest: true
