# الجوال الوهمي: يبني WM Onyx، يشغله على Emulator بمقاس الفولد، يسوي سيناريوهات ثابتة ويصوّرها.
# الصور تنرفع لفرع emu-shots عشان Claude يشوفها قبل ما توصل أي نسخة لوليد.
name: Onyx Emulator

on:
  push:
    paths:
      - "onyx/**"
      - ".github/emu/**"
      - ".github/workflows/onyx-emulator.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onyx-emulator
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: onyx
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Run scenarios on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 .github/emu/run.py onyx/app/build/outputs/apk/release/app-release.apk emu-out

      - name: Upload shots (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emu-shots
          path: emu-out
          if-no-files-found: warn

      - name: Publish shots to emu-shots branch
        if: always()
        run: |
          [ -d emu-out ] || exit 0
          cd emu-out
          echo "commit: ${{ github.sha }} · run: ${{ github.run_id }}" > RUN.txt
          git init -q
          git checkout -q -b emu-shots
          git add -A
          git -c user.name="onyx-ci" -c user.email="ci@users.noreply.github.com" commit -qm "Emulator shots for ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" emu-shots
