# الجوال الوهمي: يبني WM Onyx مرة وحدة، ويشغله على جوالين وهميين بالتوازي (الخارجية والداخلية)،
# يسوي سيناريوهات ثابتة ويصوّرها. الصور تنرفع لفرع emu-shots عشان Claude يشوفها قبل ما توصل أي نسخة لوليد.
# أسرع: الشاشتين مع بعض + الجوال الوهمي محفوظ جاهز (AVD cache) بدل ما يشتغل من الصفر كل مرة.
name: Onyx Emulator

on:
  push:
    paths:
      - "onyx/**"
      - ".github/emu/**"
      - ".github/workflows/onyx-emulator.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onyx-emulator
  cancel-in-progress: true

env:
  EMU_OPTS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: onyx
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: onyx-apk
          path: onyx/app/build/outputs/apk/release/app-release.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        screen: [outer, inner]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: onyx-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      # الجوال الوهمي محفوظ جاهز بعد أول تشغيل (يوفر وقت الإقلاع)
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-pixel7-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: false
          emulator-options: ${{ env.EMU_OPTS }}
          script: echo "AVD snapshot ready"

      - name: Run scenarios on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-snapshot-save ${{ env.EMU_OPTS }}
          script: python3 .github/emu/run.py apk/app-release.apk emu-out ${{ matrix.screen }}

      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emu-${{ matrix.screen }}
          path: emu-out
          if-no-files-found: warn

  publish:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: emu-*
          path: parts

      - name: Publish shots to emu-shots branch
        run: |
          mkdir -p emu-out
          : > emu-out/REPORT.md
          for s in outer inner; do
            d="parts/emu-$s"
            [ -d "$d" ] || { echo "## ❌ الشاشة $s ما اشتغلت" >> emu-out/REPORT.md; continue; }
            [ -f "$d/REPORT.md" ] && { cat "$d/REPORT.md" >> emu-out/REPORT.md; echo >> emu-out/REPORT.md; rm "$d/REPORT.md"; }
            cp -r "$d"/. emu-out/
          done
          cd emu-out
          echo "commit: ${{ github.sha }} · run: ${{ github.run_id }}" > RUN.txt
          git init -q
          git checkout -q -b emu-shots
          git add -A
          git -c user.name="onyx-ci" -c user.email="ci@users.noreply.github.com" commit -qm "Emulator shots for ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" emu-shots
